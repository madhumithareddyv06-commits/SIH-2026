<main>

    <div class="skill-gap-container">

        <div class="page-header">

            <h1>Skill Gap Analysis</h1>

            <p>
                Target Role:
                <strong id="targetRole">Loading...</strong>
            </p>

        </div>


        <!-- MATCH SCORE -->

        <div class="score-card">

            <h2>Industry Match Score</h2>

                <div
                    class="progress-fill"
                    id="progressFill">
                </div>

            </div>

        </div>


        <!-- CURRENT + MISSING SKILLS -->

        <div class="skills-grid">

            <div class="glass-card">

                <h2>Current Skills ✅</h2>

                <div
                    class="skill-list"
                    id="currentSkills">
                </div>

            </div>


            <div class="glass-card">

                <h2>Skill Gaps ❌</h2>

                <div
                    class="skill-list"
                    id="missingSkills">
                </div>

            </div>

        </div>


        <!-- DETAILED ANALYSIS -->

        <div class="glass-card skill-analysis">

            <h2>Skill Analysis</h2>

            <div id="skillAnalysis"></div>

        </div>


        <!-- RECOMMENDATIONS -->

        <div class="recommendation-card">

            <h2>AI Recommendations 🤖</h2>
